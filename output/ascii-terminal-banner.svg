<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Build, learn, grow</title>
  <desc id="desc">A dark terminal-inspired banner with a monochrome ASCII wave and electric blue accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080b10"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#68717d" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#d8e1eb" stop-opacity=".9"/>
      <stop offset=".72" stop-color="#72a7ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#9da8b5" stop-opacity=".24"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
