    <text x="300" y="118">X # 0 1 / : + = x X . ; * 0 # / X 1 + : . 0 x # X / + ; 1 * = / # 0 x X</text>
    <text x="280" y="136">/ . : X # 1 0 + = x ; * X / # 1 0 : + x . ; / X # 0 1 = + * : x / X # 1 0</text>
    <text x="275" y="154"># X / 1 : . 0 + * = x X # / 1 ; : + 0 x * X / # . 1 = + : / 0 X # x ; * 1</text>
    <text x="280" y="172">1 0 # X / : + = * x . ; 1 / X # 0 : + = x * ; / 1 X # . 0 + / X : ; * 1 #</text>
    <text x="300" y="190">: ; / X # 1 0 . + = x * / X : # 0 1 + ; * x . = / X # 1 0 : + = * x ; / X</text>
    <text x="320" y="208">X 1 / # : ; . 0 + = * x / X 1 # : . ; + 0 x = * / # X 1 : + ; . 0 / x # X</text>
    <text x="340" y="226">. : / X # 1 0 + = x * ; / 0 X # 1 : + = x . ; * / X # 1 0 + = : x ; * / # X</text>
    <text x="360" y="244">+ = x / X # 0 1 : . ; * / # X 1 0 + = x : ; / X # 0 1 + * . : / X # 1 0 x</text>
  </g>
  <g fill="#58a6ff" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700">
    <text x="510" y="106">&gt;&gt;</text>
    <text x="786" y="151">0101</text>
    <text x="1008" y="210">#&gt;</text>
  </g>
  <g fill="#dbe7f5">
    <circle cx="696" cy="70" r="2"/><circle cx="884" cy="225" r="2"/>
    <circle cx="1115" cy="75" r="1.5"/><circle cx="566" cy="218" r="1.5"/>
  </g>
  <text x="72" y="70" fill="#8b949e" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2">hassankhadija06 / profile</text>
  <text x="72" y="137" fill="#f0f3f6" font-family="Consolas, 'Courier New', monospace" font-size="39" font-weight="700" letter-spacing="1">BUILD. LEARN. GROW.</text>
  <rect x="74" y="158" width="46" height="3" rx="1.5" fill="#58a6ff"/>
